<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 상세</title>
<!-- 글꼴 Pretendard 1.3.9 (프론트와 같음) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 색 · 글자 · 간격은 JOBReady 프론트(원티드 몽타주 + 합격 그린, PRD 10.2)와 같은 값 -->
<style>
:root{
  --ink-body:oklch(0.259 0.01 273);--ink-label:oklch(0.298 0.01 273);--line:oklch(0.521 0.018 273);
  --background:oklch(0.972 0.002 286);--card:oklch(1 0 0);
  --foreground:color-mix(in oklab,var(--ink-body) 88%,white);
  --foreground-strong:oklch(0.148 0.004 277);
  --muted-foreground:color-mix(in oklab,var(--ink-label) 61%,white);
  --foreground-subtle:color-mix(in oklab,var(--ink-label) 43%,white);
  --foreground-disabled:color-mix(in oklab,var(--ink-label) 28%,white);
  --muted:oklch(0.961 0.002 286);
  --fill:color-mix(in oklab,var(--line) 10%,transparent);
  --border:color-mix(in oklab,var(--line) 8%,transparent);
  --border-outline:color-mix(in oklab,var(--line) 16%,transparent);
  --border-strong:color-mix(in oklab,var(--line) 35%,transparent);
  /* 합격 그린 (PRD 10.2) */
  --primary:oklch(0.47 0.1 163);--primary-foreground:oklch(1 0 0);
  --highlight:oklch(0.955 0.035 163);--highlight-foreground:oklch(0.4 0.09 163);
  --highlight-weak:oklch(0.985 0.012 163);
  --interaction-hover:oklch(0.205 0.004 286 / 0.075);--interaction-active:oklch(0.205 0.004 286 / 0.18);
  --overlay:oklch(0 0 0);
  --shadow-raise:0 1px 2px oklch(0.155 0 0 / 0.06),0 1px 3px oklch(0 0 0 / 0.05);
  --font-sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:16px;line-height:1.5;letter-spacing:.0057em;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img{display:block}
button{font:inherit;letter-spacing:inherit}
/* 몽타주 타입 스케일 (프론트 app.css @theme) */
.t-caption1{font-size:12px;line-height:1.334;letter-spacing:.0252em}
.t-label2{font-size:13px;line-height:1.385;letter-spacing:.0194em}
.t-label1{font-size:14px;line-height:1.429;letter-spacing:.0145em}
.t-body2{font-size:15px;line-height:1.467;letter-spacing:.0096em}
.t-headline1{font-size:18px;line-height:1.445;letter-spacing:-.002em}
.t-heading2{font-size:20px;line-height:1.4;letter-spacing:-.012em}
.t-title3{font-size:24px;line-height:1.334;letter-spacing:-.023em}
.c-strong{color:var(--foreground-strong)}.c-muted{color:var(--muted-foreground)}.c-subtle{color:var(--foreground-subtle)}
.c-primary{color:var(--primary)}
.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.pre{white-space:pre-line}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding:40px 24px 96px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px}
/* 섹션 머리: 제목 + 헤어라인, 선 앞쪽에 primary 짧은 선 (프론트 SectionHead · TemplateSection) */
.sh{display:flex;align-items:center;gap:16px}
.sh h2{flex:none;font-weight:700;color:var(--foreground-strong)}
.sh i{position:relative;flex:1;height:1px;background:var(--border)}
.sh i::before{content:"";position:absolute;left:0;top:-1px;height:2px;border-radius:999px;background:var(--primary)}
/* 몽타주 button: 굵기 700, solid는 hover 때 인터랙션 층 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;height:40px;padding:0 20px;border:1px solid transparent;border-radius:10px;font-size:15px;font-weight:700;letter-spacing:.006em;white-space:nowrap;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.btn svg{width:16px;height:16px;flex:none}
.btn-p{background:var(--primary);color:var(--primary-foreground)}
.btn-p:hover{background-image:linear-gradient(var(--interaction-hover),var(--interaction-hover))}
.btn-p:active{background-image:linear-gradient(var(--interaction-active),var(--interaction-active))}
.btn-o{border-color:var(--border-outline);background:var(--card);color:var(--foreground)}
.btn-o:hover{background:var(--muted)}
.btn-sm{height:32px;padding:0 14px;border-radius:8px;font-size:14px}
.btn-sm svg{width:14px;height:14px}
.btn-lg{height:44px}
.btn:disabled{cursor:default;background:var(--fill);color:var(--foreground-disabled);background-image:none}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 30%,transparent)}
/* 몽타주 chip brand 34px */
.chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;background:var(--highlight);color:var(--highlight-foreground);font-size:13px;font-weight:600;letter-spacing:.0194em}
/* 확대 보기 */
.zoom{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:32px;background:color-mix(in oklch,var(--overlay) 86%,transparent);cursor:zoom-out}
.zoom img{max-width:min(1100px,100%);max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:12px}
.zoom button{position:absolute;top:20px;right:20px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:999px;background:color-mix(in oklch,white 10%,transparent);color:#fff;cursor:pointer}
.zoom button:hover{background:color-mix(in oklch,white 20%,transparent)}
.zoom button svg{width:20px;height:20px}

.wrap{max-width:1180px}
.article{display:flex;flex-direction:column;gap:48px}
.sec{display:flex;flex-direction:column;gap:16px}
.sh h2{font-size:18px;line-height:1.445;letter-spacing:-.002em}
.sh i::before{width:40px}
/* ① 히어로: 왼쪽 4px primary (프론트와 같음) */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 360px;align-items:center;gap:40px;padding:40px;border-left:4px solid var(--primary)}
.hero-l{display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;align-items:center;gap:8px}
.meta .bar{color:var(--border-strong)}
.hero h1{font-size:30px;line-height:1.375;font-weight:700;color:var(--foreground-strong);letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* 사진 칸: 비면 점선 + 라벨 (프론트 PhotoBox) */
.photo{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;text-align:center;font-size:12px;font-weight:500}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photo.empty{border:1px dashed var(--border-strong);background:var(--card);color:var(--foreground-subtle)}
.ar-hero{aspect-ratio:4/3}.ar-shot{aspect-ratio:16/10}
/* ② 핵심 흐름 */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.step{display:flex;flex-direction:column;gap:4px;padding:12px 16px;border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:12px;background:var(--card)}
.step small{font-size:12px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.arrow{width:16px;height:16px;color:var(--foreground-subtle)}
/* ③ 핵심 설계 */
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.dc{display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:12px}
.dc p{line-height:1.625}
/* ④ 트러블슈팅 */
.tbox{padding:8px 28px;border-radius:12px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:24px}
.trow.head{padding:12px 0}
.trow.item{padding:16px 0;border-top:1px solid var(--border)}
.trow .why{display:flex;flex-direction:column;gap:4px;line-height:1.625}
.trow .why b{margin-right:6px;color:var(--primary)}
/* ⑤ 결과 및 화면 */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.shot{display:flex;flex-direction:column;gap:8px}
.shot .photo{box-shadow:var(--shadow-raise)}
.cap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cap button{display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:none;color:var(--primary);font-weight:600;cursor:pointer}
.cap button:hover{text-decoration:underline}
.cap button svg{width:14px;height:14px}
@media (max-width:760px){
  .wrap{padding:24px 16px 64px}
  .hero{grid-template-columns:minmax(0,1fr);padding:24px}
  .g3,.g2,.trow{grid-template-columns:minmax(0,1fr)}
  .trow{gap:8px}.trow.head{display:none}.tbox{padding:4px 20px}
  .hero h1{font-size:24px}
}
</style>
<script src="../_runtime/preact.min.js"></script>
<script src="../_runtime/dc-lite.js"></script>
</head>

<script>

class Component extends DCLogic {
  constructor(p){ super(p); this.state = { zoom: "" }; }
  componentDidMount() {
    // 확대 보기는 Esc로도 닫는다
    try { window.addEventListener("keydown", (e) => { if (e.key === "Escape" && this.state.zoom) this.setState({ zoom: "" }); }); } catch (e) {}
  }
  renderVals() {
    const page = window.__PAGE_DATA || SAMPLE_PROJECT;
    const text = (v) => (typeof v === "string" ? v : "");
    const title = Array.isArray(page.title) ? page.title : [text(page.title)];
    const imageAddress = (value) => {
      const v = text(value);
      return /^(https?:|data:image\/)/i.test(v) || v.indexOf("images/") >= 0 ? v : "";
    };
    const open = (src) => () => { if (src) this.setState({ zoom: src }); };
    const kind = text(page.kind), period = text(page.period);
    const github = text(page.github_url);
    const heroSrc = imageAddress(page.hero_image);
    const flow = (page.flow || []).map(text);
    const screens = (page.screens || []).map((s) => {
      const src = imageAddress(s && s.file);
      return { label: text(s && s.label), src: src, hasImage: !!src, showEmpty: !src, open: open(src) };
    });
    if (typeof document !== "undefined" && title[0]) document.title = [title[0], title[1]].filter(Boolean).join(" ");
    return {
      kind: kind, hasKind: !!kind, period: period, hasPeriod: !!period, hasBar: !!(kind && period),
      titleLead: text(title[0]), titleRest: text(title[1]),
      techs: (page.techs || []).map(text).filter(Boolean),
      hasGithub: /^https?:\/\//i.test(github), githubUrl: github,
      heroSrc: heroSrc, hasHero: !!heroSrc, showHeroEmpty: !heroSrc,
      heroAlt: [title[0], title[1]].filter(Boolean).join(" ") + " 히어로 이미지",
      openHero: open(heroSrc),
      flow: flow.map((label, i) => ({ no: String(i + 1).padStart(2, "0"), label: label, arrow: i < flow.length - 1 })),
      hasFlow: flow.length > 0,
      design: page.design || [], hasDesign: (page.design || []).length > 0,
      troubleshooting: page.troubleshooting || [], hasTrouble: (page.troubleshooting || []).length > 0,
      screens: screens, hasScreens: screens.length > 0,
      zoom: this.state.zoom, hasZoom: !!this.state.zoom,
      closeZoom: () => this.setState({ zoom: "" })
    };
  }
}

window.__DC_COMPONENT = Component;
window.__dcStart();
</script>
